[package]
name = "win-launcher"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "タスクトレイ常駐ランチャー（行先・シャットダウン予約・各種リンク）"

# Windows専用の依存。他OSでは時刻計算ロジックのテストだけ通る。
[target.'cfg(windows)'.dependencies]
tray-icon = "0.26"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_SystemInformation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"     # サイズ優先
lto = true
codegen-units = 1
panic = "abort"
strip = true
